<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ouwen / 文件库</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', Courier, monospace;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 48px 24px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header {
    margin-bottom: 48px;
    border-bottom: 1px solid #21262d;
    padding-bottom: 24px;
  }
  .site-label { font-size: 12px; color: #7d8590; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-size: 28px; font-weight: 700; color: #e6edf3; letter-spacing: -0.02em; }
  h1 span { color: #58a6ff; }
  .subtitle { margin-top: 6px; font-size: 13px; color: #7d8590; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #7d8590; margin-bottom: 12px; }
  .file-list { border: 1px solid #21262d; border-radius: 8px; overflow: hidden; margin-bottom: 40px; }
  .file-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-bottom: 1px solid #21262d;
    text-decoration: none; color: inherit; transition: background 0.15s;
  }
  .file-item:last-child { border-bottom: none; }
  .file-item:hover { background: #161b22; }
  .file-icon {
    width: 32px; height: 32px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em; flex-shrink: 0;
  }
  .icon-pdf  { background: #3d1a1a; color: #f78166; }
  .icon-c    { background: #1a2a3d; color: #58a6ff; }
  .icon-asm  { background: #1a2d1a; color: #3fb950; }
  .icon-md   { background: #2d2a1a; color: #d29922; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 14px; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 12px; color: #7d8590; margin-top: 2px; }
  .file-action { font-size: 12px; color: #58a6ff; white-space: nowrap; opacity: 0; transition: opacity 0.15s; }
  .file-item:hover .file-action { opacity: 1; }
</style>
</head>
<body>
<div class="container">

  <header>
    <p class="site-label">miyuncs / ouwen</p>
    <h1>文件<span>库</span></h1>
    <p class="subtitle">C 语言 · 汇编语言 · 学习资料</p>
  </header>

  <p class="section-title">所有文件</p>

  <div class="file-list">

    <a class="file-item" href="view.html?file=add1.asm">
      <div class="file-icon icon-asm">ASM</div>
      <div class="file-info">
        <div class="file-name">add1.asm</div>
        <div class="file-meta">汇编语言源码</div>
      </div>
      <span class="file-action">查看 →</span>
    </a>

    <a class="file-item" href="view.html?file=add2.asm">
      <div class="file-icon icon-asm">ASM</div>
      <div class="file-info">
        <div class="file-name">add2.asm</div>
        <div class="file-meta">汇编语言源码</div>
      </div>
      <span class="file-action">查看 →</span>
    </a>

  </div>

</div>
</body>
</html>
