<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查看文件</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/x86asm.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid #21262d;
    background: #161b22;
  }
  .back-btn {
    color: #58a6ff;
    text-decoration: none;
    font-size: 13px;
  }
  .back-btn:hover { text-decoration: underline; }
  .filename {
    font-size: 14px;
    color: #e6edf3;
    font-weight: 600;
  }
  .filetype {
    font-size: 12px;
    color: #7d8590;
    margin-left: auto;
  }
  #pdf-container {
    width: 100%;
    height: calc(100vh - 57px);
  }
  #pdf-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  #code-container {
    padding: 24px;
  }
  #code-container pre {
    border-radius: 8px;
    border: 1px solid #21262d;
    overflow-x: auto;
  }
  #code-container pre code {
    font-size: 13px;
    line-height: 1.6;
    padding: 20px !important;
  }
  #error {
    padding: 48px 24px;
    text-align: center;
    color: #7d8590;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <a class="back-btn" href="/">← 返回文件库</a>
  <span class="filename" id="header-filename">加载中...</span>
  <span class="filetype" id="header-type"></span>
</header>

<div id="pdf-container" style="display:none">
  <iframe id="pdf-frame"></iframe>
</div>

<div id="code-container" style="display:none">
  <pre><code id="code-block"></code></pre>
</div>

<div id="error" style="display:none">
  无法加载文件
</div>

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get('file');

if (!file) {
  document.getElementById('error').style.display = 'block';
} else {
  document.getElementById('header-filename').textContent = file;
  const ext = file.split('.').pop().toLowerCase();

  if (ext === 'pdf') {
    document.getElementById('header-type').textContent = 'PDF 文档';
    document.getElementById('pdf-container').style.display = 'block';
    document.getElementById('pdf-frame').src = file;
  } else {
    const typeMap = {
      'c': 'C 语言源码',
      'h': 'C 头文件',
      'asm': '汇编语言源码',
      's': '汇编语言源码',
      'md': 'Markdown 文档',
      'txt': '文本文件'
    };
    document.getElementById('header-type').textContent = typeMap[ext] || '文本文件';
    document.getElementById('code-container').style.display = 'block';

    // 依次尝试 UTF-8、GBK、Big5 编码
    const encodings = ['utf-8', 'gbk', 'big5'];

    async function fetchWithEncoding(url, encodingList) {
      const response = await fetch(url);
      if (!response.ok) throw new Error('not found');
      const buffer = await response.arrayBuffer();

      for (const encoding of encodingList) {
        try {
          const decoder = new TextDecoder(encoding, { fatal: true });
          const text = decoder.decode(buffer);
          return text;
        } catch (e) {
          // 该编码解码失败，尝试下一个
          continue;
        }
      }
      // 全部失败则用 UTF-8 宽松模式
      const decoder = new TextDecoder('utf-8', { fatal: false });
      return decoder.decode(buffer);
    }

    fetchWithEncoding(file, encodings)
      .then(text => {
        const block = document.getElementById('code-block');
        const langMap = { 'c': 'c', 'h': 'c', 'asm': 'x86asm', 's': 'x86asm', 'md': 'markdown' };
        const lang = langMap[ext] || 'plaintext';
        block.className = `language-${lang}`;
        block.textContent = text;
        hljs.highlightElement(block);
      })
      .catch(() => {
        document.getElementById('code-container').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      });
  }
}
</script>
</body>
</html>
